<p-blockUI [blocked]="boolLoading">
  <i class="pi pi-spin pi-spinner-dotted" style="font-size: 3rem"></i>
</p-blockUI>
<p-toast />

<h2>Sessão</h2>

<div *ngIf="!boolManterRegistro">
  <p-table
  #dt
  [value]="lstSessao"
  [tableStyle]="{ 'min-width': '50rem' }"
  styleClass="p-datatable-sm p-datatable-striped"
  responsiveLayout="stack"
  [paginator]="true"
  [rows]="5"
  [rowsPerPageOptions]="[5, 10, 20, 50, 100]"
  [globalFilterFields]="['SesDesc', 'TiSNome', 'GraNome']"
  >
  <ng-template pTemplate="caption">
    <div class="flex">
        <p-iconField iconPosition="left" class="ml-auto">
            <p-inputIcon>
                <i class="pi pi-search"></i>
            </p-inputIcon>
            <input
                pInputText
                type="text"
                (input)="onGlobalFilter(dt, $event)"
                placeholder="Pesquisa" />
        </p-iconField>
    </div>
  </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th style="text-align: center;">Nº Sessão</th>
            <th style="text-align: center;">Data</th>
            <th style="text-align: center;">Tipo</th>
            <th style="text-align: center;">Grau</th>
            <th style="text-align: center;">Descrição</th>
            <th style="text-align: center;">Liberada</th>
            <th style="text-align: center;">Status</th>
            <th style="text-align: center;">Opções</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
            <td style="text-align: center;">{{ item.SesNume }}</td>
            <td style="text-align: center;"><span class="p-column-title"><b>Data</b></span>{{ item.SesDtHr | date:'dd/MM/yyyy - hh:MM:ss' }}</td>
            <td style="text-align: center;">{{ item.TiSNome }}</td>
            <td style="text-align: center;">{{ item.GraNome }}</td>
            <td>{{ item.SesDesc }}</td>
            <td style="text-align: center;">{{ item.SesLibe ? 'Sim' : 'Não' }}</td>
            <td style="text-align: center;">{{ item.SesStat ? 'Ativa' : 'Inativa' }}</td>
            <td style="text-align: center;">
              <p-button (click)="EditarRegistro(item);" icon="pi pi-pen-to-square" [rounded]="true" [text]="true" severity="info" pTooltip="Editar" tooltipPosition="left"/>
              <p-button icon="pi {{item.SesLibe ? 'pi-ban' : 'pi-thumbs-up'}}" [rounded]="true" [text]="true" [severity]="item.SesLibe ? 'danger' : 'success'" pTooltip="{{item.SesLibe ? 'Travar' : 'Liberar'}}" tooltipPosition="left"/>
              <p-button icon="pi {{item.SesStat ? 'pi-lock-open' : 'pi-lock'}}" [rounded]="true" [text]="true" [severity]="item.SesStat ? 'danger' : 'success'" pTooltip="{{item.SesStat ? 'Inativar' : 'Ativar' }}" tooltipPosition="left"/>
            </td>
        </tr>
    </ng-template>
  </p-table>
</div>

<div *ngIf="boolManterRegistro">

  <div class="text-right">
    <p-button label="Salvar" [raised]="true" severity="success" /> &nbsp;
    <p-button (click)="CancelaRegitro();" label="Cancelar" [raised]="true" severity="danger" />
  </div>
</div>
